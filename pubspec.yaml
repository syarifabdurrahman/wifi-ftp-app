name: quick_wifi_share
description: "Quick and secure WiFi FTP file sharing application."
publish_to: 'none'

version: 1.1.2+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  ftp_server: ^2.3.2
  network_info_plus: ^8.1.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  path: ^1.9.1
  qr_flutter: ^4.1.0
  animations: ^2.2.0
  google_mobile_ads: ^5.2.0
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^13.1.0
  disk_space_2: ^1.0.12
  archive: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "Assets/Icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - Assets/
    - Assets/file_manager/
    - Assets/ftp_connection_home/
    - Assets/ftp_settings/
    - Assets/transfer_history/
